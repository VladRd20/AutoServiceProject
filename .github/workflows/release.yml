name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nicio versiune nu se publica daca testele de siguranta a datelor pica.
      - name: Lint + test
        run: npm run lint && npm test

      - name: Build and publish (electron-builder -> GitHub Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # Notele publicului (GitHub Release + banner de actualizare) vin din aceeasi lista
      # "Ce e nou" pe care o vede utilizatorul - fara detalii tehnice.
      - name: Release notes from "Ce e nou"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
